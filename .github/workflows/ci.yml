name: CI

# A runner is a fresh clone with no local state by construction, which is what
# the Phase 0.1 definition of done asks for.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # Before restore, so the checks report on a tree where nothing else can
      # run. Not because an analyser cannot report when the build is broken: it
      # can, measured, and it reports alongside a compile error. What it cannot
      # survive is a failed restore, where none runs at all [D-W33]. The checks
      # live in the script rather than here, so there is one definition of each
      # and a developer can run the same thing locally.
      - name: Guards
        shell: pwsh
        run: ./guards.ps1

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release --verbosity normal
