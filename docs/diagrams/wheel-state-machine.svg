<svg viewBox="0 0 940 500" width="940" height="500" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a2" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#52606D"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="940" height="500" fill="#FAFAF7"/>

  <text x="470" y="42" text-anchor="middle" font-size="20" font-weight="700" fill="#1F2933">The wheel: four states</text>
  <text x="470" y="65" text-anchor="middle" font-size="13" fill="#52606D">one trial runs from cash back to cash</text>

  <rect x="110" y="110" width="220" height="76" rx="10" fill="#FFFFFF" stroke="#1F2933" stroke-width="2"/>
  <text x="220" y="145" text-anchor="middle" font-size="16" font-weight="600" fill="#1F2933">Cash</text>
  <text x="220" y="166" text-anchor="middle" font-size="11.5" fill="#52606D">collateral uncommitted</text>

  <rect x="610" y="110" width="220" height="76" rx="10" fill="#EAF2F8" stroke="#2E6DA4" stroke-width="2"/>
  <text x="720" y="145" text-anchor="middle" font-size="16" font-weight="600" fill="#1F2933">Short Put</text>
  <text x="720" y="166" text-anchor="middle" font-size="11.5" fill="#52606D">cash secured at the strike</text>

  <rect x="610" y="330" width="220" height="76" rx="10" fill="#FFFFFF" stroke="#1F2933" stroke-width="2"/>
  <text x="720" y="365" text-anchor="middle" font-size="16" font-weight="600" fill="#1F2933">Holding Shares</text>
  <text x="720" y="386" text-anchor="middle" font-size="11.5" fill="#52606D">assigned, basis recorded</text>

  <rect x="110" y="330" width="220" height="76" rx="10" fill="#EAF2F8" stroke="#2E6DA4" stroke-width="2"/>
  <text x="220" y="365" text-anchor="middle" font-size="16" font-weight="600" fill="#1F2933">Short Call</text>
  <text x="220" y="386" text-anchor="middle" font-size="11.5" fill="#52606D">covered, above basis</text>

  <line x1="330" y1="134" x2="603" y2="134" stroke="#52606D" stroke-width="1.8" marker-end="url(#a2)"/>
  <text x="466" y="124" text-anchor="middle" font-size="12" fill="#1F2933">sell cash-secured put</text>

  <path d="M603,168 C500,200 440,200 337,168" fill="none" stroke="#52606D" stroke-width="1.8" marker-end="url(#a2)"/>
  <text x="470" y="208" text-anchor="middle" font-size="12" fill="#52606D">expires worthless, keep the premium</text>

  <line x1="760" y1="186" x2="760" y2="323" stroke="#52606D" stroke-width="1.8" marker-end="url(#a2)"/>
  <text x="775" y="260" font-size="12" fill="#1F2933">assigned</text>
  <text x="775" y="277" font-size="12" fill="#52606D">at the strike</text>

  <line x1="610" y1="356" x2="337" y2="356" stroke="#52606D" stroke-width="1.8" marker-end="url(#a2)"/>
  <text x="473" y="346" text-anchor="middle" font-size="12" fill="#1F2933">sell covered call</text>

  <path d="M337,390 C440,422 500,422 603,390" fill="none" stroke="#52606D" stroke-width="1.8" marker-end="url(#a2)"/>
  <text x="470" y="446" text-anchor="middle" font-size="12" fill="#52606D">expires worthless, keep the premium</text>

  <line x1="175" y1="330" x2="175" y2="193" stroke="#52606D" stroke-width="1.8" marker-end="url(#a2)"/>
  <text x="70" y="260" font-size="12" fill="#1F2933">shares</text>
  <text x="70" y="277" font-size="12" fill="#1F2933">called away</text>
