<svg viewBox="0 0 1260 1160" width="1260" height="1160" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#52606D"/>
    </marker>
    <marker id="ahw" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#C77A2E"/>
    </marker>
    <marker id="ahr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#B4544A"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1260" height="1160" fill="#FAFAF7"/>

  <text x="630" y="44" text-anchor="middle" font-size="21" font-weight="700" fill="#1F2933">OptionsWheelLab architecture</text>
  <text x="630" y="68" text-anchor="middle" font-size="13.5" fill="#52606D">risk gated before the choice, outcome defined after it</text>

  <!-- Row A -->
  <rect x="185" y="92" width="290" height="62" rx="8" fill="#FFFFFF" stroke="#7A8B99" stroke-width="1.5"/>
  <text x="330" y="118" text-anchor="middle" font-size="15" font-weight="600" fill="#1F2933">EODHD daily snapshot</text>
  <text x="330" y="136" text-anchor="middle" font-size="11.5" fill="#52606D">chains, bars, dividends, earnings dates</text>

  <rect x="545" y="92" width="290" height="62" rx="8" fill="#FFFFFF" stroke="#7A8B99" stroke-width="1.5"/>
  <text x="690" y="118" text-anchor="middle" font-size="15" font-weight="600" fill="#1F2933">Chain Store</text>
  <text x="690" y="136" text-anchor="middle" font-size="11.5" fill="#52606D">append-only, point-in-time</text>

  <rect x="905" y="92" width="290" height="62" rx="8" fill="#FFFFFF" stroke="#7A8B99" stroke-width="1.5"/>
  <text x="1050" y="118" text-anchor="middle" font-size="15" font-weight="600" fill="#1F2933">Watchlist</text>
  <text x="1050" y="136" text-anchor="middle" font-size="11.5" fill="#52606D">membership as of that date, not today's list</text>

  <line x1="475" y1="123" x2="538" y2="123" stroke="#52606D" stroke-width="1.6" marker-end="url(#ah)"/>
  <line x1="835" y1="123" x2="898" y2="123" stroke="#52606D" stroke-width="1.6" marker-end="url(#ah)"/>

  <!-- Row B: candidate generator with risk gate inside -->
  <rect x="270" y="190" width="720" height="142" rx="10" fill="#FFFFFF" stroke="#1F2933" stroke-width="2"/>
  <text x="630" y="215" text-anchor="middle" font-size="16" font-weight="700" fill="#1F2933">Candidate Generator</text>

  <rect x="295" y="228" width="310" height="80" rx="8" fill="#F2F5F7" stroke="#7A8B99" stroke-width="1.4"/>
  <text x="450" y="255" text-anchor="middle" font-size="14" font-weight="600" fill="#1F2933">Enumerate</text>
  <text x="450" y="274" text-anchor="middle" font-size="11.5" fill="#52606D">every sellable contract today,</text>
  <text x="450" y="290" text-anchor="middle" font-size="11.5" fill="#52606D">with its features</text>

  <rect x="655" y="228" width="310" height="80" rx="8" fill="#FBEDED" stroke="#B4544A" stroke-width="2"/>
  <text x="810" y="255" text-anchor="middle" font-size="14" font-weight="600" fill="#1F2933">Risk Gate</text>
  <text x="810" y="274" text-anchor="middle" font-size="11.5" fill="#52606D">concentration caps, committed capital,</text>
  <text x="810" y="290" text-anchor="middle" font-size="11.5" fill="#52606D">simultaneous-assignment stress</text>

  <line x1="605" y1="268" x2="648" y2="268" stroke="#52606D" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="630" y="325" text-anchor="middle" font-size="11.5" fill="#52606D" font-style="italic">output: the feasible set, identical for all three makers</text>

  <line x1="690" y1="154" x2="690" y2="183" stroke="#52606D" stroke-width="1.6" marker-end="url(#ah)"/>
  <polyline points="1050,154 1050,172 940,172 940,183" fill="none" stroke="#52606D" stroke-width="1.6" marker-end="url(#ah)"/>

  <!-- Row C -->
  <rect x="185" y="390" width="270" height="72" rx="8" fill="#EAF2F8" stroke="#2E6DA4" stroke-width="1.5"/>
  <text x="320" y="418" text-anchor="middle" font-size="15" font-weight="600" fill="#1F2933">Frozen Baseline</text>
  <text x="320" y="437" text-anchor="middle" font-size="11.5" fill="#52606D">control policy, never changes</text>

  <rect x="495" y="390" width="270" height="72" rx="8" fill="#EAF2F8" stroke="#2E6DA4" stroke-width="1.5"/>
  <text x="630" y="418" text-anchor="middle" font-size="15" font-weight="600" fill="#1F2933">Random Within Band</text>
  <text x="630" y="437" text-anchor="middle" font-size="11.5" fill="#52606D">control, no selection skill</text>

  <rect x="805" y="390" width="270" height="72" rx="8" fill="#FDF0E3" stroke="#C77A2E" stroke-width="2"/>
  <text x="940" y="418" text-anchor="middle" font-size="15" font-weight="600" fill="#1F2933">Learner</text>
  <text x="940" y="437" text-anchor="middle" font-size="11.5" fill="#52606D">acts from current policy rows</text>

  <line x1="500" y1="332" x2="330" y2="383" stroke="#52606D" stroke-width="1.6" marker-end="url(#ah)"/>
  <line x1="630" y1="332" x2="630" y2="383" stroke="#52606D" stroke-width="1.6" marker-end="url(#ah)"/>
  <line x1="760" y1="332" x2="930" y2="383" stroke="#52606D" stroke-width="1.6" marker-end="url(#ah)"/>

  <!-- Row D -->
  <rect x="340" y="500" width="560" height="58" rx="8" fill="#FFFFFF" stroke="#1F2933" stroke-width="2"/>
  <text x="620" y="524" text-anchor="middle" font-size="15" font-weight="700" fill="#1F2933">Decision Record</text>
  <text x="620" y="542" text-anchor="middle" font-size="11.5" fill="#52606D">feasible set, features, choice, and which maker chose it</text>

  <line x1="320" y1="462" x2="440" y2="493" stroke="#52606D" stroke-width="1.6" marker-end="url(#ah)"/>
  <line x1="630" y1="462" x2="630" y2="493" stroke="#52606D" stroke-width="1.6" marker-end="url(#ah)"/>
  <line x1="940" y1="462" x2="810" y2="493" stroke="#52606D" stroke-width="1.6" marker-end="url(#ah)"/>

  <!-- Row E -->
  <rect x="250" y="600" width="280" height="68" rx="8" fill="#FFFFFF" stroke="#7A8B99" stroke-width="1.5"/>
  <text x="390" y="628" text-anchor="middle" font-size="15" font-weight="600" fill="#1F2933">Fill Model</text>
  <text x="390" y="646" text-anchor="middle" font-size="11.5" fill="#52606D">bid not mid, fees, slippage</text>

  <rect x="600" y="600" width="400" height="68" rx="8" fill="#FFFFFF" stroke="#7A8B99" stroke-width="1.5"/>
  <text x="800" y="628" text-anchor="middle" font-size="15" font-weight="600" fill="#1F2933">Wheel State Machine and Ledger</text>
  <text x="800" y="646" text-anchor="middle" font-size="11.5" fill="#52606D">cash, short put, shares, short call, cost basis</text>

  <line x1="470" y1="558" x2="400" y2="593" stroke="#52606D" stroke-width="1.6" marker-end="url(#ah)"/>
  <line x1="770" y1="558" x2="800" y2="593" stroke="#52606D" stroke-width="1.6" marker-end="url(#ah)"/>
  <line x1="530" y1="634" x2="593" y2="634" stroke="#52606D" stroke-width="1.6" marker-end="url(#ah)"/>

  <!-- portfolio state back to risk gate -->
  <polyline points="1000,620 1225,620 1225,268 972,268" fill="none" stroke="#B4544A" stroke-width="1.8" marker-end="url(#ahr)"/>
  <text x="1243" y="445" text-anchor="middle" font-size="11.5" fill="#B4544A" font-weight="600" transform="rotate(-90 1243 445)">committed capital and concentration</text>

  <!-- judging layer -->
  <rect x="150" y="700" width="970" height="330" rx="10" fill="none" stroke="#4A7C59" stroke-width="1.6" stroke-dasharray="7 5"/>
  <text x="150" y="692" font-size="12" font-weight="600" fill="#4A7C59">judging layer: receives nothing the learner produced</text>

  <rect x="300" y="718" width="600" height="64" rx="8" fill="#EEF6EE" stroke="#4A7C59" stroke-width="1.5"/>
  <text x="600" y="744" text-anchor="middle" font-size="15" font-weight="600" fill="#1F2933">Counterfactual Scorer</text>
  <text x="600" y="763" text-anchor="middle" font-size="11.5" fill="#52606D">score every candidate that was available, then rank the one actually chosen</text>

  <rect x="250" y="812" width="700" height="90" rx="8" fill="#EEF6EE" stroke="#4A7C59" stroke-width="2"/>
  <text x="600" y="838" text-anchor="middle" font-size="15" font-weight="700" fill="#1F2933">Outcome Metric</text>
  <text x="600" y="857" text-anchor="middle" font-size="11.5" fill="#52606D">return on capital committed at the strike, scored from open through to return to cash</text>
  <text x="600" y="874" text-anchor="middle" font-size="11.5" fill="#52606D">so assignment is inside the number, not outside it</text>
  <text x="600" y="892" text-anchor="middle" font-size="11.5" fill="#B4544A" font-weight="600">maximum adverse excursion recorded alongside every outcome</text>

  <line x1="600" y1="782" x2="600" y2="805" stroke="#52606D" stroke-width="1.6" marker-end="url(#ah)"/>
  <line x1="800" y1="668" x2="700" y2="711" stroke="#52606D" stroke-width="1.6" marker-end="url(#ah)"/>

  <rect x="175" y="928" width="290" height="68" rx="8" fill="#EEF6EE" stroke="#4A7C59" stroke-width="1.5"/>
  <text x="320" y="956" text-anchor="middle" font-size="14" font-weight="600" fill="#1F2933">Feature Grader</text>
  <text x="320" y="974" text-anchor="middle" font-size="11.5" fill="#52606D">which properties predicted well</text>

  <rect x="505" y="928" width="290" height="68" rx="8" fill="#EEF6EE" stroke="#4A7C59" stroke-width="1.5"/>
  <text x="650" y="956" text-anchor="middle" font-size="14" font-weight="600" fill="#1F2933">Improvement Instrument</text>
  <text x="650" y="974" text-anchor="middle" font-size="11.5" fill="#52606D">regret curve against the baseline</text>

  <rect x="835" y="928" width="270" height="68" rx="8" fill="#FBEDED" stroke="#B4544A" stroke-width="2"/>
  <text x="970" y="956" text-anchor="middle" font-size="14" font-weight="600" fill="#1F2933">Risk Drift Check</text>
  <text x="970" y="974" text-anchor="middle" font-size="11.5" fill="#52606D">excursion and assignment rate</text>

  <line x1="450" y1="902" x2="360" y2="921" stroke="#52606D" stroke-width="1.6" marker-end="url(#ah)"/>
  <line x1="620" y1="902" x2="650" y2="921" stroke="#52606D" stroke-width="1.6" marker-end="url(#ah)"/>
  <line x1="800" y1="902" x2="950" y2="921" stroke="#52606D" stroke-width="1.6" marker-end="url(#ah)"/>

  <!-- left rail -->
  <polyline points="340,529 128,529 128,750 293,750" fill="none" stroke="#52606D" stroke-width="1.6" marker-end="url(#ah)"/>
  <polyline points="128,750 128,1087 313,1087" fill="none" stroke="#52606D" stroke-width="1.6" marker-end="url(#ah)"/>

  <!-- Row H -->
  <rect x="320" y="1058" width="560" height="58" rx="8" fill="#FDF0E3" stroke="#C77A2E" stroke-width="2"/>
  <text x="600" y="1082" text-anchor="middle" font-size="15" font-weight="700" fill="#1F2933">Learning Channel</text>
  <text x="600" y="1100" text-anchor="middle" font-size="11.5" fill="#52606D">reads the record and the grades, emits new policy rows</text>

  <line x1="320" y1="996" x2="430" y2="1051" stroke="#52606D" stroke-width="1.6" marker-end="url(#ah)"/>

  <polyline points="880,1087 1170,1087 1170,426 1082,426" fill="none" stroke="#C77A2E" stroke-width="2" marker-end="url(#ahw)"/>
  <text x="1188" y="740" text-anchor="middle" font-size="11.5" fill="#C77A2E" font-weight="600" transform="rotate(-90 1188 740)">policy rows only, and never the risk caps</text>

  <text x="630" y="1148" text-anchor="middle" font-size="12" fill="#52606D" font-style="italic">the learner chooses within the feasible set; it does not get to widen it</text>
</svg>
